name: Build PojavLauncher APK

on:
  push:
    branches: [ main, v3_openjdk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app_pojavlauncher:assembleDebug --stacktrace --no-daemon
        env:
          JAVA_OPTS: "-Xmx3072m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PojavLauncher-Offline-Debug
          path: |
            app_pojavlauncher/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
